# Configuration Netlify pour HYNERA Environnement
[build]
  publish = "."

# URLs propres : /traitement-bois sert traitement-bois.html
[[redirects]]
  from = "/traitement-bois"
  to = "/traitement-bois.html"
  status = 200
[[redirects]]
  from = "/desinsectisation"
  to = "/desinsectisation.html"
  status = 200
[[redirects]]
  from = "/deratisation"
  to = "/deratisation.html"
  status = 200
[[redirects]]
  from = "/depigeonnage"
  to = "/depigeonnage.html"
  status = 200
[[redirects]]
  from = "/desinfection"
  to = "/desinfection.html"
  status = 200
[[redirects]]
  from = "/facade-toiture"
  to = "/facade-toiture.html"
  status = 200
[[redirects]]
  from = "/deratisation-rennes"
  to = "/deratisation-rennes.html"
  status = 200
[[redirects]]
  from = "/deratisation-saint-malo"
  to = "/deratisation-saint-malo.html"
  status = 200
[[redirects]]
  from = "/nuisibles-vannes"
  to = "/nuisibles-vannes.html"
  status = 200
[[redirects]]
  from = "/desinsectisation-rennes"
  to = "/desinsectisation-rennes.html"
  status = 200
[[redirects]]
  from = "/traitement-bois-bretagne"
  to = "/traitement-bois-bretagne.html"
  status = 200
[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200
[[redirects]]
  from = "/merci"
  to = "/merci.html"
  status = 200
[[redirects]]
  from = "/actualites"
  to = "/actualites.html"
  status = 200

# ── Sécurité (en-têtes appliqués à tout le site) ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Empêche l'indexation du domaine de preview / branch deploys Netlify ──
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex"
